<!DOCTYPE html>
<html dir="rtl">
<head>
<script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="ms-10 bg-red-500 w-10 h-10"></div>
<script>
setTimeout(() => {
    const el = document.querySelector('div');
    console.log(window.getComputedStyle(el).marginInlineStart);
}, 1000);
</script>
<div id="trialModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="document.getElementById('trialModal').classList.add('hidden')"></div>
        <div class="relative bg-white dark:bg-gray-900 w-full max-w-md p-8 rounded-2xl shadow-2xl m-4">
            <button class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 dark:hover:text-white" onclick="document.getElementById('trialModal').classList.add('hidden')">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="text-2xl font-bold font-serif mb-2 text-gray-900 dark:text-white">Book Free Trial</h3>
            <p class="text-gray-600 dark:text-gray-400 mb-6 text-sm">Fill out the form below and we'll contact you to schedule your session.</p>
            <form class="space-y-4">
                <div>
                    <input type="text" placeholder="Full Name" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary" required>
                </div>
                <div>
                    <input type="email" placeholder="Email Address" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary" required>
                </div>
                <div>
                    <select class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
                        <option value="">Select Instrument of Interest</option>
                        <option value="piano">Piano</option>
                        <option value="guitar">Guitar</option>
                        <option value="vocals">Vocals</option>
                        <option value="violin">Violin</option>
                        <option value="drums">Drums</option>
                    </select>
                </div>
                <button type="button" onclick="alert('Trial booked! We will contact you soon.'); document.getElementById('trialModal').classList.add('hidden');" class="w-full bg-primary hover:bg-red-800 text-white font-bold py-3 rounded-lg transition-colors">
                    Submit Request
                </button>
            </form>
        </div>
    </div>

    </body>
</html>
